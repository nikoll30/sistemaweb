  </head>
  <body>

    <!-- Activar botón menú lateral -->
    <div class="hamburger" onclick="toggleSidebar()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="main-container">
      <!-- Barra opciones lateral izquierda -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-container">
            <img src="../assets/images/img_sidebar_logo.png" alt="Biomedical Technologies Logo" class="logo" />

          </div>
        
          <div class="user-profile">
            <div class="profile-image-container">
              <img src="../assets/images/img_doctor_1.png" alt="Foto de perfil de usuario" class="profile-image" />
            </div>
            <span class="profile-name">Nombre Usuario</span>
          </div>
        </div>

        <nav class="sidebar-menu" role="navigation">
          <a href="PortalUsuInicio.html" class="menu-item" role="menuitem">
            <img src="../assets/images/img_vector_light_blue_800.svg" alt="Icono inicio" class="menu-icon" />
            <span class="menu-text">Inicio</span>
          </a>

          <a href="PortalUsuCitas.html" class="menu-item" role="menuitem">
            <img src="../assets/images/img_group.svg" alt="Icono citas" class="menu-icon" />
            <span class="menu-text">Citas</span>
          </a>
  
          <a href="PortalUsuMiPerfil.html" class="menu-item active" role="menuitem">
            <img src="../assets/images/img_vector_light_blue_800_30x12.svg" alt="Icono perfil" class="menu-icon" />

          </a>

          <a href="index.html" class="menu-item" role="menuitem">
            <img src="../assets/images/img_vector_light_blue_800_22x22.svg" alt="Icono cerrar sesión" class="menu-icon" />
            <span class="menu-text">Cerrar Sesión</span>
          </a>
        </nav>
      </aside>

      <!-- Mensajería + Notificaciones + Nombre Usuario -->
      <main class="main-content">
        <header class="header">
          <div class="header-actions">
            <div class="notification-icon">
              <img src="../assets/images/img_vector_gray_400.svg" alt="Notificaciones" class="notification-badge" />
            </div>
            <img src="../assets/images/img_vector_gray_400_60x60.svg" alt="Configuración" class="settings-icon" />
            <button class="user-avatar">NA</button>
            <span class="user-name">Nombre Usuario</span>
          </div>
        </header>

        <button class="dashboard-title">Editar Perfil</button>

        <section class="content-section">

          <!-- Contenedor de formulario de perfil -->
          <div class="profile-container">
            
            <div class="form-group">
              <label class="form-label">Nombres</label>
              <div class="form-input">
                <span>Ejemplo</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Apellido paterno</label>
              <div class="form-input">
                <span>Ejemplo</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Apellido materno</label>
              <div class="form-input">
                <span>Ejemplo</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Celular</label>
              <div class="form-input">
                <span>123456789</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">N° documento</label>
              <div class="form-input">
                <span>12345678</span>
              </div>
            </div> <!-- 👈 ahora sí cerrado correctamente -->

            <div class="form-group">
              <label class="form-label" for="sexo">Sexo</label>
              <select id="sexo" name="sexo" class="form-select">
                <option value="" disabled selected>Selecciona</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="afiliacion">Tipo Afiliación</label>
              <select id="afiliacion" name="afiliacion" class="form-select">
                <option value="" disabled selected>Selecciona</option>
                <option value="titular">Titular</option>
                <option value="dependiente">Dependiente</option>
                <option value="estudiante">Estudiante</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Correo electrónico</label>
              <div class="form-input">
                <span>Ingresa tu correo</span>
              </div>
            </div>

            <!-- Botón -->
            <div class="form-actions">
              <button class="btn-save">Guardar Cambios</button>
            </div>
            
          </div>
        </section>  
      </main>
    </div>
    <script>
      function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('open');
      }

      // Make sidebar visible by default on large screens
      if (window.innerWidth >= 1024) {
        document.getElementById('sidebar').classList.add('open');
      }

      // Cerrar barra lateral al hacer clic afuera en móvil
      document.addEventListener('click', function(event) {
        const sidebar = document.getElementById('sidebar');
        const hamburger = document.querySelector('.hamburger');
        
        if (window.innerWidth < 1024 && 
            !sidebar.contains(event.target) && 
            !hamburger.contains(event.target) && 
            sidebar.classList.contains('open')) {
          sidebar.classList.remove('open');
        }
      });
      
      // Handle menu item clicks
      document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', function() {
          document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
          this.classList.add('active');
        });
      });
      
      // Manejar clics en los elementos del menú
      document.querySelectorAll('.page-number').forEach(page => {
        page.addEventListener('click', function() {
          document.querySelectorAll('.page-number').forEach(p => p.classList.remove('active'));
          this.classList.add('active');
        });
      });
      
      // Manejar clics en la paginación
      document.querySelectorAll('.filter-input, .dropdown-input').forEach(filter => {
        filter.addEventListener('change', function() {
          console.log('Filter changed:', this.value);
          // Add filter logic here
        });
      });
      
      // Manejar cambios en los filtros
      document.querySelectorAll('.action-icon').forEach(icon => {
        icon.addEventListener('click', function(e) {
          e.stopPropagation();
          const action = this.alt.includes('Edit') ? 'edit' : 
                        this.alt.includes('Delete') ? 'delete' : 
                        this.alt.includes('View') ? 'view' : 'print';
          console.log('Action clicked:', action);
          // Add action logic here
        });
      });
    </script>
  </body>
</html>
